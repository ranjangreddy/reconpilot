# ReconPilot local Postgres (optional — SQLite is the default for demo/test).
# One-command setup:
#   docker compose up -d
#   DATABASE_URL=postgresql://reconpilot:reconpilot@localhost:5432/reconpilot python demo.py
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reconpilot
      POSTGRES_USER: reconpilot
      POSTGRES_PASSWORD: reconpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
